<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>习惯</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--c0:#000;--c1:#1a1a1a;--c2:#333;--c4:#666;--c5:#999;--c6:#d5d5d5;
  --c7:#e8e8e8;--c8:#f3f3f3;--c9:#fafafa;--cw:#fff;
  --ff:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);font-weight:300;color:var(--c1);background:var(--cw);min-height:100vh;letter-spacing:.01em;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-weight:300}
input{font-family:inherit;outline:none}

/* Header */
.page-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;position:sticky;top:0;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:10;border-bottom:1px solid transparent;transition:border-color .2s}
.page-hd.scrolled{border-bottom-color:var(--c7)}
.page-hd .hd-title{font-size:1.05rem;font-weight:500;letter-spacing:.02em}
.page-hd .hd-back{font-size:.82rem;color:var(--c5);padding:2px 0;letter-spacing:.02em;display:none}
.page-hd .hd-back:hover{color:var(--c0)}
.page-hd .hd-add{width:30px;height:30px;border-radius:50%;border:1px solid var(--c6);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--c4);transition:all .15s;line-height:1}
.page-hd .hd-add:hover{border-color:var(--c0);color:var(--c0)}

main{max-width:560px;margin:0 auto;padding:10px 14px 80px}

/* Main view */
#main-view{display:block}
#detail-view{display:none}

.habits-section{margin-bottom:16px}
.habits-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:440px){.habits-grid{grid-template-columns:1fr}}

/* Habit card */
.habit-card{border:1px solid var(--c7);padding:12px 10px 10px;cursor:pointer;transition:border-color .15s;background:var(--cw)}
.habit-card:hover{border-color:var(--c0)}
.habit-card.done-today{opacity:.7}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card-top .toggle{width:26px;height:26px;border-radius:50%;border:2px solid var(--c6);display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;transition:all .15s;line-height:1;padding:0;background:var(--cw)}
.card-top .toggle.done{background:var(--c0);border-color:var(--c0);color:var(--cw)}
.card-top .habit-name{flex:1;font-size:.8rem;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;cursor:pointer}
.card-top .habit-name:hover{text-decoration:underline}
.card-top .cal-toggle{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--c5);flex-shrink:0;transition:transform .15s;padding:0;line-height:1}
.card-top .cal-toggle:hover{color:var(--c0)}

/* Mini calendar inside card */
.card-cal .mc{width:100%}
.card-cal .mc-title{font-size:.62rem;color:var(--c5);text-align:center;margin-bottom:3px;letter-spacing:.06em}
.card-cal .mc-grid{display:grid;grid-template-columns:repeat(7,1fr);justify-items:center;padding:0 2px}
.card-cal .mc-grid span{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.58rem}
.card-cal .mc-hd{color:var(--c5);font-size:.5rem!important}
.card-cal .mc-done{color:var(--c0);font-weight:400}
.card-cal .mc-miss{color:var(--c6)}
.card-cal .mc-fut{color:transparent}
.card-cal .mc-today{border:1.5px solid var(--c0);border-radius:50%;font-weight:500}

/* Divider */
.section-divider{display:flex;align-items:center;gap:10px;margin:18px 0 10px;color:var(--c5);font-size:.65rem;letter-spacing:.06em}
.section-divider::before,.section-divider::after{content:'';flex:1;height:1px;background:var(--c7)}

/* Empty */
.empty{padding:40px 20px;text-align:center;color:var(--c5);font-size:.8rem;letter-spacing:.02em}

/* Detail view */
.detail-stat-row{display:flex;gap:24px;margin-bottom:20px;flex-wrap:wrap}
.detail-stat{min-width:60px}
.detail-stat .sv{font-size:1.3rem;font-weight:300;letter-spacing:-.02em}
.detail-stat .sl{font-size:.65rem;color:var(--c5);margin-top:1px;letter-spacing:.04em}

.detail-months{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
@media(max-width:500px){.detail-months{grid-template-columns:repeat(3,1fr);gap:8px}}

.detail-months .dm-mc{text-align:center}
.detail-months .dm-title{font-size:.6rem;color:var(--c5);margin-bottom:2px;letter-spacing:.04em}
.detail-months .dm-grid{display:grid;grid-template-columns:repeat(7,1fr);justify-items:center}
.detail-months .dm-grid span{width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:.48rem}
.detail-months .dm-hd{color:var(--c5);font-size:.4rem!important}
.detail-months .dm-done{color:var(--c0)}
.detail-months .dm-miss{color:var(--c6)}
.detail-months .dm-fut{color:transparent}
.detail-months .dm-today{border:1.3px solid var(--c0);border-radius:50%}

.chart-box{position:relative;height:190px;margin:16px 0}

.detail-actions{display:flex;gap:10px;margin-top:16px}
.detail-actions button{font-size:.7rem;color:var(--c5);padding:5px 12px;border:1px solid var(--c7);letter-spacing:.03em;transition:all .15s}
.detail-actions button:hover{color:var(--c0);border-color:var(--c0)}
.detail-actions .del-btn:hover{color:#b91c1c;border-color:#fecaca}

.name-editor{border:none;border-bottom:1.5px solid var(--c0);font-size:1rem;font-weight:400;padding:2px 0;background:transparent;width:100%;max-width:240px}

/* Util bar */
.util-bar{display:flex;gap:14px;justify-content:center;padding:24px 0 0;margin-top:24px;border-top:1px solid var(--c7)}
.util-bar button{font-size:.68rem;color:var(--c5);letter-spacing:.05em;padding:3px 0;border-bottom:1px dotted var(--c6);transition:all .15s}
.util-bar button:hover{color:var(--c0);border-bottom-color:var(--c0)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100;display:flex;align-items:center;justify-content:center}
.modal-overlay.hidden{display:none}
.modal-box{background:var(--cw);padding:22px 18px 18px;width:calc(100% - 36px);max-width:320px}
.modal-box .modal-title{font-size:.82rem;font-weight:500;margin-bottom:12px;letter-spacing:.02em}
.modal-box input{padding:9px 10px;border:1px solid var(--c7);font-size:.85rem;font-weight:300;background:var(--c9);width:100%}
.modal-box input:focus{border-color:var(--c0);background:var(--cw)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.modal-actions button{font-size:.75rem;padding:6px 14px;letter-spacing:.02em}
.modal-actions .btn-cancel{color:var(--c5);border:1px solid var(--c7)}
.modal-actions .btn-confirm{background:var(--c0);color:var(--cw);border:1px solid var(--c0)}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--c0);color:var(--cw);padding:9px 22px;font-size:.76rem;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;letter-spacing:.02em}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="page-hd" id="page-header">
  <button class="hd-back" id="btn-back">← 返回</button>
  <span class="hd-title" id="hd-title">习惯</span>
  <button class="hd-add" id="btn-add-habit" title="新建">+</button>
</div>

<main>
  <div id="main-view">
    <div id="habits-undone"></div>
    <div id="divider-area"></div>
    <div id="habits-done"></div>
    <div class="empty" id="habits-empty" style="display:none">还没有习惯<br><span style="font-size:.7rem;color:var(--c5)">点右上角 + 创建第一个</span></div>
  </div>

  <div id="detail-view">
    <div id="detail-content"></div>
  </div>

  <div class="util-bar">
    <button id="btn-export">导出数据</button>
    <button id="btn-import">导入数据</button>
    <input type="file" id="import-file" accept=".json" style="display:none">
  </div>
</main>

<div class="modal-overlay hidden" id="new-habit-modal">
  <div class="modal-box">
    <div class="modal-title">新建习惯</div>
    <input type="text" id="new-habit-name" placeholder="习惯名称" maxlength="30" autocomplete="off">
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">取消</button>
      <button class="btn-confirm" id="modal-confirm">创建</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ DATA ============
const K='ht-v3';
let d;
function load(){try{const r=localStorage.getItem(K);d=r?{habits:JSON.parse(r).habits||[]}:{habits:[]};}catch(e){d={habits:[]};}}
function save(){localStorage.setItem(K,JSON.stringify(d));}
load();
function ts(){const dt=new Date();return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function ds(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function dim(y,m){return new Date(y,m+1,0).getDate();}
const DOW=['日','一','二','三','四','五','六'];
let detailHid=null;
let expandedCals=new Set();

// ============ TOAST ============
let tt;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1600);}

// ============ SCROLL HEADER ============
window.addEventListener('scroll',()=>{
  document.getElementById('page-header').classList.toggle('scrolled',window.scrollY>4);
});

// ============ RENDER MAIN VIEW ============
function renderMain(){
  const today=ts();
  const now=new Date();
  const thisY=now.getFullYear();
  const thisM=now.getMonth();

  const sorted=[...d.habits].sort((a,b)=>{
    const aDone=!!a.completions[today];
    const bDone=!!b.completions[today];
    if(aDone===bDone)return 0;
    return aDone?1:-1;
  });

  const empty=document.getElementById('habits-empty');
  if(d.habits.length===0){
    document.getElementById('habits-undone').innerHTML='';
    document.getElementById('habits-done').innerHTML='';
    document.getElementById('divider-area').innerHTML='';
    empty.style.display='block';
    return;
  }
  empty.style.display='none';

  let firstDoneIdx=sorted.findIndex(h=>!!h.completions[today]);
  if(firstDoneIdx===-1)firstDoneIdx=sorted.length;
  const undone=sorted.slice(0,firstDoneIdx);
  const done=sorted.slice(firstDoneIdx);

  document.getElementById('habits-undone').innerHTML=undone.length>0?
    '<div class="habits-grid">'+undone.map(h=>cardHTML(h,today,thisY,thisM)).join('')+'</div>':'';
  document.getElementById('habits-done').innerHTML=done.length>0?
    '<div class="habits-grid">'+done.map(h=>cardHTML(h,today,thisY,thisM)).join('')+'</div>':'';
  document.getElementById('divider-area').innerHTML=done.length>0&&undone.length>0?
    '<div class="section-divider">已完成</div>':'';

  bindCardEvents();
}

function cardHTML(h,today,thisY,thisM){
  const isDone=!!h.completions[today];
  const calOpen=expandedCals.has(h.id);
  return `<div class="habit-card${isDone?' done-today':''}" data-hid="${h.id}">
    <div class="card-top">
      <button class="toggle${isDone?' done':''}" data-action="toggle">${isDone?'✓':''}</button>
      <span class="habit-name" data-action="detail">${h.name}</span>
      <button class="cal-toggle" data-action="cal-toggle">${calOpen?'⌄':'›'}</button>
    </div>
    ${calOpen?'<div class="card-cal">'+calHTML(thisY,thisM,h.completions,today)+'</div>':''}
  </div>`;
}

function calHTML(y,m,completions,today){
  const ddim=dim(y,m);
  const fd=new Date(y,m,1).getDay();
  let h='<div class="mc"><div class="mc-title">'+(m+1)+'月</div><div class="mc-grid">';
  DOW.forEach(d=>{h+='<span class="mc-hd">'+d+'</span>';});
  for(let i=0;i<fd;i++) h+='<span></span>';
  for(let day=1;day<=ddim;day++){
    const dds=ds(y,m,day);
    let c='';
    if(dds>today) c='mc-fut';
    else if(completions[dds]) c='mc-done';
    else c='mc-miss';
    if(dds===today) c+=' mc-today';
    h+='<span class="'+c+'">'+(dds>today?'·':(completions[dds]?'●':'○'))+'</span>';
  }
  h+='</div></div>';
  return h;
}

function bindCardEvents(){
  // Calendar toggle
  document.querySelectorAll('[data-action="cal-toggle"]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const hid=btn.closest('.habit-card').dataset.hid;
      if(expandedCals.has(hid))expandedCals.delete(hid);else expandedCals.add(hid);
      renderMain();
    });
  });
  // Detail: click habit name
  document.querySelectorAll('[data-action="detail"]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      openDetail(el.closest('.habit-card').dataset.hid);
    });
  });
  // Toggle
  document.querySelectorAll('[data-action="toggle"]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const hid=btn.closest('.habit-card').dataset.hid;
      const h=d.habits.find(x=>x.id===hid);
      if(!h)return;
      const today=ts();
      if(h.completions[today]){delete h.completions[today];}else{h.completions[today]=true;}
      save();renderMain();
    });
  });
}

// ============ DETAIL VIEW ============
function openDetail(hid){
  detailHid=hid;
  const h=d.habits.find(x=>x.id===hid);
  document.getElementById('main-view').style.display='none';
  document.getElementById('detail-view').style.display='block';
  document.getElementById('btn-back').style.display='inline';
  document.getElementById('hd-title').textContent=h?h.name:'详情';
  document.getElementById('btn-add-habit').style.display='none';
  renderDetail();
}

function closeDetail(){
  detailHid=null;
  document.getElementById('main-view').style.display='block';
  document.getElementById('detail-view').style.display='none';
  document.getElementById('btn-back').style.display='none';
  document.getElementById('hd-title').textContent='习惯';
  document.getElementById('btn-add-habit').style.display='';
  const c=document.getElementById('detail-chart');
  if(c){const ex=Chart.getChart(c);if(ex)ex.destroy();}
  renderMain();
}

document.getElementById('btn-back').addEventListener('click',closeDetail);

function renderDetail(){
  const h=d.habits.find(x=>x.id===detailHid);
  if(!h){closeDetail();return;}
  const today=ts();
  const now=new Date();
  const thisY=now.getFullYear();
  const thisM=now.getMonth();

  const totalDone=Object.keys(h.completions).length;
  const ddim=dim(thisY,thisM);
  const daysPassed=Math.min(parseInt(today.slice(8)),ddim);
  let monthDone=0;
  for(let d=1;d<=daysPassed;d++){if(h.completions[ds(thisY,thisM,d)])monthDone++;}
  const monthRate=daysPassed>0?Math.round(monthDone/daysPassed*100):0;
  let last30=0;
  for(let i=0;i<30;i++){const dt=new Date(today);dt.setDate(dt.getDate()-i);if(h.completions[dt.toISOString().slice(0,10)])last30++;}

  let monthsHTML='';
  for(let i=11;i>=0;i--){
    let m=thisM-i,y=thisY;
    if(m<0){m+=12;y--;}
    const ddim2=dim(y,m);
    const fd2=new Date(y,m,1).getDay();
    let gridHTML='';
    DOW.forEach(d=>{gridHTML+='<span class="dm-hd">'+d+'</span>';});
    for(let j=0;j<fd2;j++) gridHTML+='<span></span>';
    for(let day=1;day<=ddim2;day++){
      const dds=ds(y,m,day);
      let c='';
      if(dds>today) c='dm-fut';
      else if(h.completions[dds]) c='dm-done';
      else c='dm-miss';
      if(dds===today) c+=' dm-today';
      gridHTML+='<span class="'+c+'">'+(dds>today?'·':(h.completions[dds]?'●':'○'))+'</span>';
    }
    monthsHTML+='<div class="dm-mc"><div class="dm-title">'+(m+1)+'月</div><div class="dm-grid">'+gridHTML+'</div></div>';
  }

  document.getElementById('detail-content').innerHTML=`
    <div style="margin-bottom:8px">
      <span id="name-editor-wrap">
        <span id="detail-name-text" style="font-size:1.05rem;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;transition:border-color .15s" onclick="startRename()">${h.name}</span>
      </span>
    </div>
    <div class="detail-stat-row">
      <div class="detail-stat"><div class="sv">${totalDone}</div><div class="sl">总完成</div></div>
      <div class="detail-stat"><div class="sv">${monthRate}%</div><div class="sl">本月完成率</div></div>
      <div class="detail-stat"><div class="sv">${last30}</div><div class="sl">近30天</div></div>
    </div>
    <div class="detail-months">${monthsHTML}</div>
    <div class="chart-box"><canvas id="detail-chart"></canvas></div>
    <div class="detail-actions">
      <button onclick="startRename()">重命名</button>
      <button class="del-btn" onclick="deleteHabit()">删除</button>
    </div>
  `;

  setTimeout(()=>{
    const canvas=document.getElementById('detail-chart');
    if(!canvas)return;
    const labels=[],data=[];
    for(let i=11;i>=0;i--){
      let m=thisM-i,y=thisY;
      if(m<0){m+=12;y--;}
      labels.push((m+1)+'月');
      let c=0;
      for(let d=1;d<=dim(y,m);d++){if(h.completions[ds(y,m,d)])c++;}
      data.push(c);
    }
    const ctx=canvas.getContext('2d');
    new Chart(ctx,{type:'bar',data:{labels,datasets:[
      {label:'完成天数',data,backgroundColor:'#000',borderRadius:0}
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{
      y:{grid:{color:'#f3f3f3'},ticks:{font:{size:8},stepSize:1},title:{display:true,text:'天',font:{size:8,weight:300}}},
      x:{grid:{display:false},ticks:{font:{size:8}}}
    }}});
  },50);
}

function startRename(){
  const h=d.habits.find(x=>x.id===detailHid);
  if(!h)return;
  const wrap=document.getElementById('name-editor-wrap');
  wrap.innerHTML='<input class="name-editor" id="rename-inp" value="'+h.name.replace(/"/g,'&quot;')+'">';
  const inp=document.getElementById('rename-inp');
  inp.focus();inp.select();
  const done=()=>{
    const v=inp.value.trim();
    if(v&&v!==h.name){h.name=v;save();}
    renderDetail();
  };
  inp.addEventListener('blur',done);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();});
}

function deleteHabit(){
  const h=d.habits.find(x=>x.id===detailHid);
  if(!h)return;
  if(!confirm('删除「'+h.name+'」？所有记录将丢失。'))return;
  d.habits=d.habits.filter(x=>x.id!==detailHid);
  save();toast('已删除');closeDetail();
}

// ============ NEW HABIT MODAL ============
const modal=document.getElementById('new-habit-modal');
const modalInput=document.getElementById('new-habit-name');
document.getElementById('btn-add-habit').addEventListener('click',()=>{
  modal.classList.remove('hidden');modalInput.value='';setTimeout(()=>modalInput.focus(),100);
});
document.getElementById('modal-cancel').addEventListener('click',()=>modal.classList.add('hidden'));
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.add('hidden');});
document.getElementById('modal-confirm').addEventListener('click',()=>{
  const name=modalInput.value.trim();
  if(!name){toast('请输入习惯名称');return;}
  d.habits.push({id:gid(),name,completions:{}});
  save();modal.classList.add('hidden');renderMain();toast('已创建：'+name);
});
modalInput.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('modal-confirm').click();});

// ============ IMPORT / EXPORT ============
document.getElementById('btn-export').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='habit-tracker-'+ts()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
  toast('已导出');
});
document.getElementById('btn-import').addEventListener('click',()=>document.getElementById('import-file').click());
document.getElementById('import-file').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const imported=JSON.parse(ev.target.result);
      if(!imported.habits||!Array.isArray(imported.habits)){toast('格式不正确');return;}
      const existIds=new Set(d.habits.map(h=>h.id));
      imported.habits.forEach(ih=>{
        if(existIds.has(ih.id)){
          const cur=d.habits.find(h=>h.id===ih.id);
          if(cur&&ih.completions)cur.completions={...cur.completions,...ih.completions};
          if(cur&&ih.name)cur.name=ih.name;
        }else{d.habits.push({...ih,completions:{...(ih.completions||{})}});existIds.add(ih.id);}
      });
      save();detailHid=null;renderMain();toast('已导入并合并');
    }catch(err){toast('文件解析失败');}
  };
  reader.readAsText(file);e.target.value='';
});

// ============ INIT ============
